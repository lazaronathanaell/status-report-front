name: ollama-pipeline-benchmark

x-gpu: &gpu
  driver: nvidia
  device_ids: ["${GPU_DEVICE_ID:-0}"]
  capabilities: [gpu]

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.12.10}
    container_name: pipeline-bench-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_GPU_OVERHEAD: ${GPU_VRAM_RESERVE_BYTES:-0}
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    cpus: ${OLLAMA_CPU_LIMIT:-4.0}
    mem_limit: ${OLLAMA_RAM_LIMIT:-8G}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
    restart: unless-stopped

  model-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-0.12.10}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1 || ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  metrics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline-bench-metrics
    command: ["python", "-m", "benchmark.pipeline.resource_monitor"]
    environment:
      RESULTS_DIR: /results
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-1}
      OLLAMA_CONTAINER: pipeline-bench-ollama
      RUNNER_CONTAINER: pipeline-bench-runner
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
      NVIDIA_DRIVER_CAPABILITIES: utility
    cpus: ${MONITOR_CPU_LIMIT:-0.25}
    mem_limit: ${MONITOR_RAM_LIMIT:-256M}
    volumes:
      - ./results:/results
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - *gpu
    restart: "no"

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline-bench-runner
    command: ["python", "-m", "benchmark.pipeline.runner"]
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      GENERATION_MODE: ${GENERATION_MODE:-original}
      TEMPERATURE: ${TEMPERATURE:-0}
      SEED: ${SEED:-42}
      NUM_CTX: ${NUM_CTX:-8192}
      INPUT_DIR: /data/input
      REFERENCE_DIR: /data/reference
      RESULTS_DIR: /results
      CASE_PROFILE: /case/profile.json
      PROCESS_ID: ${PROCESS_ID:-}
      MAX_FILES: ${MAX_FILES:-0}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-900}
      NAME_SIMILARITY_THRESHOLD: ${NAME_SIMILARITY_THRESHOLD:-0.80}
      TEXT_SIMILARITY_THRESHOLD: ${TEXT_SIMILARITY_THRESHOLD:-0.80}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
      DIPLOMA_PREPROCESS_MODE: ${DIPLOMA_PREPROCESS_MODE:-original}
      RUN_GROUP_ID: ${RUN_GROUP_ID:-}
      MATRIX_MODEL_INDEX: ${MATRIX_MODEL_INDEX:-}
      MATRIX_PROCESS_INDEX: ${MATRIX_PROCESS_INDEX:-}
    cpus: ${RUNNER_CPU_LIMIT:-2.0}
    mem_limit: ${RUNNER_RAM_LIMIT:-3G}
    volumes:
      - ${INPUT_DIR:-../docs/documentos_separados}:/data/input:ro
      - ${REFERENCE_DIR:-../docs}:/data/reference:ro
      - ${CASE_PROFILE_HOST:-./cases/22001149961202519.json}:/case/profile.json:ro
      - ./results:/results
    depends_on:
      model-pull:
        condition: service_completed_successfully
      metrics:
        condition: service_started
    restart: "no"

  preprocess:
    profiles: ["preprocess"]
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - benchmark.pipeline.preprocess
      - --index
      - /corpus/index.json
      - --raw-dir
      - /corpus/raw
      - --output-dir
      - /prepared
    cpus: ${PREPROCESS_CPU_LIMIT:-2.0}
    mem_limit: ${PREPROCESS_RAM_LIMIT:-3G}
    volumes:
      - ${INDEX_FILE:-./index.json}:/corpus/index.json:ro
      - ${RAW_DIR:-./raw}:/corpus/raw:ro
      - ./data:/prepared
    restart: "no"

volumes:
  ollama_models:
    name: ${OLLAMA_MODEL_VOLUME:-ollama-pipeline-benchmark-models}
